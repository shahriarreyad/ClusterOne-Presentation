# /etc/sysctl.d/99-clusterone-net.conf — TCP tuning for bulk transfer (N7.2).
# Deployed with tag `tuning`. Re-run the N5 matrix before/after (scripts/tuning-ab.sh);
# if BBR does not help on this fabric, set tcp_congestion_control back to cubic and record why.

net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.core.netdev_max_backlog = 30000
net.core.somaxconn = 4096

# BBR pacing works with fq; if qos/clusterone-qos.sh owns the root qdisc, BBR falls back
# to its internal TCP pacing (kernel >= 4.13) and still works.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
