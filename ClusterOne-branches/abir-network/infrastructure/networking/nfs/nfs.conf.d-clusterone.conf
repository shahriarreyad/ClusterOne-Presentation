# anchor01: /etc/nfs.conf.d/clusterone.conf — pin NFS helper ports so the firewall can name them (N4/N7)
# Without this, mountd picks a random port and the nft rule for 20048 never matches.
# Apply: systemctl restart nfs-server ; verify: rpcinfo -p | grep mountd
[nfsd]
vers3=n
vers4=y
vers4.2=y

[mountd]
port=20048
