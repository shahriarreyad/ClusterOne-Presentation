# anchor01 — central log receiver (N8). Install to /etc/rsyslog.d/10-clusterone-receive.conf
# TCP only (reliable), fabric only (the firewall admits 514 from 10.42.0.0/24 on eno2).
module(load="imtcp")
input(type="imtcp" port="514" address="10.42.0.10")

# one file per sending host; %HOSTNAME% comes from the message, so an unknown sender
# cannot write outside this directory (no path separators are allowed in it by rsyslog).
template(name="ClusterOneRemote" type="string" string="/var/log/clusterone/%HOSTNAME%/%programname%.log")

if $fromhost-ip startswith "10.42.0." then {
    action(type="omfile" dynaFile="ClusterOneRemote" dirCreateMode="0750" fileCreateMode="0640")
    stop
}
