# compute nodes — forward auth/sudo/ssh audit trail to the anchor (N8).
# Install to /etc/rsyslog.d/90-clusterone-forward.conf
# Queue to disk so a reboot of the anchor loses nothing; local logging is unchanged.
if ($syslogfacility-text == "auth" or $syslogfacility-text == "authpriv" or $programname == "sudo" or $programname == "sshd") then {
    action(type="omfwd" target="10.42.0.10" port="514" protocol="tcp"
           action.resumeRetryCount="-1"
           queue.type="LinkedList" queue.filename="fwd_anchor" queue.maxDiskSpace="256m"
           queue.saveOnShutdown="on")
}
