# /etc/chrony/chrony.conf — compute nodes (N4.2): sync from the anchor only.
# The public pools are deliberately absent: compute nodes have no unrestricted internet
# route (ADR-N6, N8 egress allowlist), and one time source keeps the fabric coherent.

server anchor01 iburst prefer minpoll 4 maxpoll 6

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony
