# /etc/chrony/chrony.conf — anchor01 (N4.2): time server for the fabric.
# Slurm, NFS mtime, distributed job coordination and log correlation all break when
# clocks drift.

# Upstream. REPLACE with the campus NTP servers once N0.4 identifies them.
pool ntp.ubuntu.com iburst maxsources 4

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony

# serve the fabric; the nft ruleset keeps NTP off the campus interface
allow 10.42.0.0/24

# keep serving the fabric if campus NTP is unreachable
local stratum 10
