# /etc/dnsmasq.d/clusterone.conf — anchor01 only (N2.5, layer 2 of name resolution).
# Layer 1 (/etc/hosts on every node) keeps the cluster alive if this service is down.

# serve on the fabric interface only — never on the campus uplink
interface=eno2
bind-interfaces
listen-address=10.42.0.10

# internal zone. Records come ONLY from the generated hosts file, not from the anchor's
# /etc/hosts (which carries a 127.0.1.1 line that would be served to the whole fabric).
domain=clusterone.internal
local=/clusterone.internal/
expand-hosts
no-hosts
addn-hosts=/etc/clusterone/hosts.dnsmasq

# forward everything else to the resolvers the anchor learned from campus DHCP.
# (systemd-resolved keeps this file current even with its stub listener disabled.)
resolv-file=/run/systemd/resolve/resolv.conf
domain-needed
bogus-priv

# DHCP staging pool for unprovisioned nodes (N2.6). NOT a home: nothing runs on .200+
dhcp-authoritative
dhcp-range=10.42.0.200,10.42.0.250,255.255.255.0,12h
dhcp-option=option:router,10.42.0.10
dhcp-option=option:dns-server,10.42.0.10
dhcp-option=option:domain-search,clusterone.internal
dhcp-option=option:ntp-server,10.42.0.10
dhcp-option=option:mtu,9000
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

log-dhcp
