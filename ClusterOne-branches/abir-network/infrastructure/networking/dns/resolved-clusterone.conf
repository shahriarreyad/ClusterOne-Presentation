# /etc/systemd/resolved.conf.d/clusterone.conf — anchor01 only.
# dnsmasq needs port 53; systemd-resolved's stub listener holds it by default (N2.5).
# Ansible also re-points /etc/resolv.conf at /run/systemd/resolve/resolv.conf, otherwise
# the anchor itself would keep resolving through a stub that no longer exists.
[Resolve]
DNSStubListener=no
