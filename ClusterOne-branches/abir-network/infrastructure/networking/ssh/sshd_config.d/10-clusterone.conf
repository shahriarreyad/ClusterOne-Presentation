# ClusterOne sshd baseline (N3). Install to /etc/ssh/sshd_config.d/10-clusterone.conf
# Ubuntu's sshd_config has `Include /etc/ssh/sshd_config.d/*.conf` at the top, and sshd
# uses the FIRST value seen for a keyword, so drop-ins beat the stock file.
# Validate before reload:  sudo sshd -t && sudo systemctl reload ssh
# Keep an existing session open while testing a new one.

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
UsePAM yes

MaxAuthTries 3
LoginGraceTime 30
MaxSessions 20
ClientAliveInterval 60
ClientAliveCountMax 3

# Only reachable on the fabric address on compute nodes is enforced by the firewall,
# not here: a ListenAddress bug would lock you out with no console.
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
LogLevel VERBOSE
