# ClusterOne sshd hardening (N8). Install to /etc/ssh/sshd_config.d/20-clusterone-hardening.conf
# ⚠ AllowGroups locks out anyone NOT in `clusterone-users`. Before enabling:
#     sudo groupadd -f clusterone-users
#     sudo usermod -aG clusterone-users <every real login, incl. your own>
#   then `sudo sshd -t`, reload, and test a NEW session before closing the old one.
#
# Match blocks must stay LAST: everything after a Match applies only to that match.

AllowGroups clusterone-users

KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Automation must still work: Ansible/Slurm connect from the anchor without a TTY.
Match Address 10.42.0.0/24
    AllowAgentForwarding no
    MaxAuthTries 6
