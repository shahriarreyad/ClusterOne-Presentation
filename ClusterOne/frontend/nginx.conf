server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks only to this server; /api/* is forwarded to the Core Engine container
    # (same path layout as the Vite dev proxy: /api/v1/... -> backend /api/v1/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
