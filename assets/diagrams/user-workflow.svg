<line x1="690.0" y1="89.0" x2="730.0" y2="89.0" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="910.0" y1="89.0" x2="990.0" y2="89.0" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="230.0" y1="321.3" x2="310.0" y2="296.7" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="490.0" y1="269.0" x2="610.0" y2="269.0" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="790.0" y1="287.9" x2="990.0" y2="330.1" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="223.8" y1="378.0" x2="316.2" y2="410.0" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="490.0" y1="439.0" x2="610.0" y2="439.0" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="790.0" y1="417.7" x2="990.0" y2="370.3" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="1080.0" y1="378.0" x2="1080.0" y2="440.0" stroke="#6b7390" stroke-width="1.5" marker-end="url(#arr)"/>
<g id="login"><rect x="50" y="60" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="140.0" y="86.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Sign in</text><text x="140.0" y="104.0" font-size="11.5" fill="#4d5778" text-anchor="middle">role sets what you see</text></g>
<g id="look"><rect x="50" y="190" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="140.0" y="216.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Check capacity</text><text x="140.0" y="234.0" font-size="11.5" fill="#4d5778" text-anchor="middle">Overview · Map · Nodes</text></g>
<g id="plan"><rect x="50" y="320" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="140.0" y="346.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Plan resources</text><text x="140.0" y="364.0" font-size="11.5" fill="#4d5778" text-anchor="middle">Guide › resource planner</text></g>
<g id="submit"><rect x="310" y="60" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="400.0" y="86.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Submit job</text><text x="400.0" y="104.0" font-size="11.5" fill="#4d5778" text-anchor="middle">web · CLI · SDK · REST</text></g>
<g id="queue"><rect x="510" y="60" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="600.0" y="86.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Queue &amp; match</text><text x="600.0" y="104.0" font-size="11.5" fill="#4d5778" text-anchor="middle">fair share · avoids busy PCs</text></g>
<g id="run"><rect x="730" y="60" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="820.0" y="86.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Run on lab PC</text><text x="820.0" y="104.0" font-size="11.5" fill="#4d5778" text-anchor="middle">sandbox · live log</text></g>
<g id="pg"><rect x="310" y="240" width="180" height="58" rx="10" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="400.0" y="266.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">LLM Playground</text><text x="400.0" y="284.0" font-size="11.5" fill="#4d5778" text-anchor="middle">pick model + PCs → chat</text></g>
<g id="pgrun"><rect x="610" y="240" width="180" height="58" rx="10" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="700.0" y="266.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Model spread on GPUs</text><text x="700.0" y="284.0" font-size="11.5" fill="#4d5778" text-anchor="middle">ready in ~3 min</text></g>
<g id="mount"><rect x="310" y="410" width="180" height="58" rx="10" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="400.0" y="436.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Mount GPUs</text><text x="400.0" y="454.0" font-size="11.5" fill="#4d5778" text-anchor="middle">clusterone mount …</text></g>
<g id="mrun"><rect x="610" y="410" width="180" height="58" rx="10" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="700.0" y="436.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Local OpenAI API</text><text x="700.0" y="454.0" font-size="11.5" fill="#4d5778" text-anchor="middle">127.0.0.1:8080/v1</text></g>
<g id="out"><rect x="990" y="60" width="180" height="58" rx="10" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="1080.0" y="86.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Download outputs</text><text x="1080.0" y="104.0" font-size="11.5" fill="#4d5778" text-anchor="middle">outputs.zip</text></g>
<g id="chat"><rect x="990" y="320" width="180" height="58" rx="10" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="1080.0" y="346.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Chat / results</text><text x="1080.0" y="364.0" font-size="11.5" fill="#4d5778" text-anchor="middle">in browser or own apps</text></g>
<g id="free"><rect x="990" y="440" width="180" height="58" rx="10" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="1080.0" y="466.0" font-size="15" font-weight="600" fill="#151b30" text-anchor="middle">Release GPUs</text><text x="1080.0" y="484.0" font-size="11.5" fill="#4d5778" text-anchor="middle">stop session · Ctrl+C</text></g>
<rect x="20" y="576" width="26" height="16" rx="4" fill="#e3ebff" stroke="#5b8cff" stroke-width="1.8"/><text x="54" y="589" font-size="12.5" fill="#3a4466">Step</text>
<rect x="94.8" y="576" width="26" height="16" rx="4" fill="#eee8ff" stroke="#a98bff" stroke-width="1.8"/><text x="128.8" y="589" font-size="12.5" fill="#3a4466">Alternative path</text>
</svg>