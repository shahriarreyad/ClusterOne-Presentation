<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="Inter, Segoe UI, system-ui, sans-serif">
<title>ClusterOne — user workflow (from Guide, Showcase and Mounts manual)</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7390"/></marker></defs>
<rect width="1200" height="610" fill="#f7f9fd"/>
<g class="group"><rect x="20" y="20" width="240" height="520" rx="14" fill="#eef2fb" stroke="#d5dcec"/><text x="34" y="38" font-size="12" fill="#5a6485" letter-spacing="1">1 · ORIENT</text></g>
<g class="group"><rect x="280" y="20" width="660" height="520" rx="14" fill="#eef2fb" stroke="#d5dcec"/><text x="294" y="38" font-size="12" fill="#5a6485" letter-spacing="1">2 · RUN WORK</text></g>
<g class="group"><rect x="960" y="20" width="220" height="520" rx="14" fill="#eef2fb" stroke="#d5dcec"/><text x="974" y="38" font-size="12" fill="#5a6485" letter-spacing="1">3 · RESULTS</text></g>
